<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <!-- 
    ==========================================================================
    QR CODE 1: Google Pay (GPay) / Primary UPI QR
    ==========================================================================
    NOTE FOR REPLACEMENT:
    You can easily replace this entire file with your real Google Pay QR code 
    (SVG or PNG renamed to qr1.svg), or export your QR code from your UPI app.
    ==========================================================================
  -->
  <defs>
    <filter id="qr-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Background with slight rounded corners -->
  <rect width="320" height="320" rx="16" fill="#FFFFFF"/>

  <!-- Quiet Zone / Inner Border -->
  <rect x="16" y="16" width="288" height="288" rx="8" fill="#FFFFFF" stroke="#F1F3F9" stroke-width="1.5"/>

  <!-- QR Matrix Group -->
  <g fill="#0F172A" filter="url(#qr-shadow)">
    <!-- Top-Left Position Detection Pattern (7x7 module) -->
    <path d="M 32 32 H 88 V 88 H 32 Z M 40 40 V 80 H 80 V 40 Z"/>
    <rect x="48" y="48" width="24" height="24" rx="3"/>

    <!-- Top-Right Position Detection Pattern -->
    <path d="M 232 32 H 288 V 88 H 232 Z M 240 40 V 80 H 280 V 40 Z"/>
    <rect x="248" y="48" width="24" height="24" rx="3"/>

    <!-- Bottom-Left Position Detection Pattern -->
    <path d="M 32 232 H 88 V 288 H 32 Z M 40 240 V 280 H 80 V 240 Z"/>
    <rect x="48" y="248" width="24" height="24" rx="3"/>

    <!-- Alignment Pattern (Bottom-Right) -->
    <path d="M 224 224 H 256 V 256 H 224 Z M 230 230 V 250 H 250 V 230 Z"/>
    <rect x="236" y="236" width="8" height="8"/>

    <!-- Timing Patterns -->
    <path d="M 96 44 h 8 v 8 h -8 z m 16 0 h 8 v 8 h -8 z m 16 0 h 8 v 8 h -8 z m 16 0 h 8 v 8 h -8 z m 16 0 h 8 v 8 h -8 z m 16 0 h 8 v 8 h -8 z m 16 0 h 8 v 8 h -8 z m 16 0 h 8 v 8 h -8 z"/>
    <path d="M 44 96 h 8 v 8 h -8 z m 0 16 h 8 v 8 h -8 z m 0 16 h 8 v 8 h -8 z m 0 16 h 8 v 8 h -8 z m 0 16 h 8 v 8 h -8 z m 0 16 h 8 v 8 h -8 z m 0 16 h 8 v 8 h -8 z m 0 16 h 8 v 8 h -8 z"/>

    <!-- QR Data Matrix Blocks (Simulated high-density QR modules) -->
    <!-- Quadrant 1: Top Mid -->
    <rect x="96" y="60" width="8" height="16" rx="1"/>
    <rect x="112" y="68" width="16" height="8" rx="1"/>
    <rect x="136" y="60" width="8" height="8" rx="1"/>
    <rect x="152" y="68" width="16" height="8" rx="1"/>
    <rect x="176" y="60" width="8" height="16" rx="1"/>
    <rect x="192" y="68" width="16" height="8" rx="1"/>
    <rect x="216" y="60" width="8" height="24" rx="1"/>
    
    <rect x="96" y="84" width="24" height="8" rx="1"/>
    <rect x="128" y="84" width="8" height="16" rx="1"/>
    <rect x="144" y="84" width="16" height="8" rx="1"/>
    <rect x="168" y="84" width="8" height="8" rx="1"/>
    <rect x="184" y="84" width="24" height="8" rx="1"/>

    <!-- Quadrant 2: Middle-Left -->
    <rect x="32" y="104" width="8" height="24" rx="1"/>
    <rect x="48" y="112" width="16" height="8" rx="1"/>
    <rect x="72" y="104" width="16" height="8" rx="1"/>
    <rect x="32" y="136" width="16" height="8" rx="1"/>
    <rect x="56" y="128" width="8" height="16" rx="1"/>
    <rect x="72" y="128" width="8" height="16" rx="1"/>
    <rect x="40" y="152" width="24" height="8" rx="1"/>
    <rect x="72" y="152" width="16" height="8" rx="1"/>
    <rect x="32" y="168" width="8" height="24" rx="1"/>
    <rect x="48" y="176" width="16" height="8" rx="1"/>
    <rect x="72" y="168" width="16" height="16" rx="1"/>
    <rect x="40" y="200" width="16" height="8" rx="1"/>
    <rect x="64" y="192" width="24" height="8" rx="1"/>

    <!-- Quadrant 3: Middle-Center -->
    <rect x="96" y="104" width="16" height="8" rx="1"/>
    <rect x="120" y="104" width="8" height="24" rx="1"/>
    <rect x="136" y="104" width="16" height="8" rx="1"/>
    <rect x="160" y="104" width="8" height="16" rx="1"/>
    <rect x="176" y="104" width="24" height="8" rx="1"/>
    <rect x="208" y="104" width="8" height="24" rx="1"/>

    <rect x="96" y="120" width="8" height="16" rx="1"/>
    <rect x="112" y="120" width="8" height="8" rx="1"/>
    <rect x="192" y="120" width="16" height="8" rx="1"/>

    <!-- Center area reserved for logo -->

    <!-- Quadrant 4: Middle-Right -->
    <rect x="224" y="104" width="16" height="8" rx="1"/>
    <rect x="248" y="104" width="8" height="24" rx="1"/>
    <rect x="264" y="104" width="24" height="8" rx="1"/>
    <rect x="224" y="120" width="8" height="16" rx="1"/>
    <rect x="240" y="120" width="16" height="8" rx="1"/>
    <rect x="272" y="120" width="16" height="16" rx="1"/>
    <rect x="224" y="144" width="24" height="8" rx="1"/>
    <rect x="256" y="136" width="8" height="16" rx="1"/>
    <rect x="272" y="144" width="16" height="8" rx="1"/>
    <rect x="232" y="160" width="16" height="8" rx="1"/>
    <rect x="256" y="160" width="32" height="8" rx="1"/>
    <rect x="224" y="176" width="8" height="24" rx="1"/>
    <rect x="240" y="176" width="24" height="8" rx="1"/>
    <rect x="272" y="176" width="16" height="8" rx="1"/>
    <rect x="240" y="192" width="16" height="16" rx="1"/>
    <rect x="264" y="192" width="24" height="8" rx="1"/>
    <rect x="264" y="208" width="16" height="8" rx="1"/>

    <!-- Quadrant 5: Bottom-Center & Bottom-Right -->
    <rect x="96" y="224" width="16" height="8" rx="1"/>
    <rect x="120" y="224" width="8" height="24" rx="1"/>
    <rect x="136" y="224" width="16" height="8" rx="1"/>
    <rect x="160" y="224" width="8" height="16" rx="1"/>
    <rect x="176" y="224" width="24" height="8" rx="1"/>
    <rect x="208" y="224" width="8" height="16" rx="1"/>

    <rect x="96" y="240" width="8" height="16" rx="1"/>
    <rect x="112" y="240" width="16" height="8" rx="1"/>
    <rect x="136" y="240" width="8" height="8" rx="1"/>
    <rect x="152" y="240" width="24" height="8" rx="1"/>
    <rect x="184" y="240" width="8" height="16" rx="1"/>
    <rect x="200" y="240" width="16" height="8" rx="1"/>

    <rect x="96" y="264" width="24" height="8" rx="1"/>
    <rect x="128" y="256" width="8" height="16" rx="1"/>
    <rect x="144" y="264" width="16" height="8" rx="1"/>
    <rect x="168" y="256" width="8" height="16" rx="1"/>
    <rect x="184" y="264" width="16" height="8" rx="1"/>
    <rect x="208" y="264" width="8" height="16" rx="1"/>
    <rect x="224" y="264" width="24" height="8" rx="1"/>
    <rect x="256" y="264" width="32" height="8" rx="1"/>
    <rect x="264" y="240" width="24" height="8" rx="1"/>
    <rect x="272" y="224" width="16" height="8" rx="1"/>
  </g>

  <!-- Center Badge / Shield: Google Pay / GPay -->
  <g transform="translate(160, 160)">
    <!-- White background badge with border -->
    <rect x="-38" y="-20" width="76" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Google 4-color stylized G icon -->
    <g transform="translate(-24, -10) scale(0.9)">
      <path d="M 10 1.5 C 15 1.5 18 3.5 19.5 5 L 16 8.5 C 14.5 7 12.5 6 10 6 C 6.5 6 3.5 8.5 2.5 12 L 0 10 C 1.5 5 5.5 1.5 10 1.5 Z" fill="#EA4335"/>
      <path d="M 2.5 12 C 2 13.5 2 15 2 16 C 2 17.5 2 19 2.5 20.5 L 0 22.5 C -0.8 19.5 -0.8 16 -0.8 13 C -0.8 11.5 -0.5 10 0 8.5 L 2.5 12 Z" fill="#FBBC05"/>
      <path d="M 10 26.5 C 14 26.5 17.5 25 19.5 22.5 L 16 19 C 14.5 20.5 12.5 21.5 10 21.5 C 6.5 21.5 3.5 19 2.5 15.5 L 0 17.5 C 1.5 22.5 5.5 26.5 10 26.5 Z" fill="#34A853"/>
      <path d="M 20 16 H 10 V 11.5 H 20 C 20.5 13 20.5 14.5 20 16 Z" fill="#4285F4"/>
    </g>

    <!-- GPay Text -->
    <text x="2" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E293B">Pay</text>
  </g>

  <!-- Bottom Indicator Label -->
  <text x="160" y="306" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.5">GOOGLE PAY / ALL UPI</text>
</svg>
