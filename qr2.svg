  <!-- Center PhonePe Badge -->
  <g transform="translate(160, 160)">
    <!-- Purple circle badge -->
    <circle cx="0" cy="0" r="22" fill="#5F259F"/>
    <circle cx="0" cy="0" r="20" fill="#5F259F" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Stylized Devanagari / PhonePe "Pe" letter in White -->
    <path d="M -6 -11 H 8 V -7 H -2 V -3 H 5 C 9 -3 11 0 11 4 C 11 8 8 11 3 11 H -6 V -11 Z M -2 7 H 3 C 5.5 7 7 5.5 7 4 C 7 2.5 5.5 1 3 1 H -2 V 7 Z" fill="#FFFFFF"/>
    <!-- Slash dot on Pe -->
    <circle cx="6" cy="-8" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Bottom Indicator Label -->
  <text x="160" y="306" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#5F259F" letter-spacing="0.5">PHONEPE UPI ACCEPTED</text>
