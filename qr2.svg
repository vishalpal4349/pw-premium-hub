    <!-- QR Data Matrix Blocks -->
    <rect x="104" y="60" width="16" height="8" rx="1"/>
    <rect x="128" y="60" width="8" height="16" rx="1"/>
    <rect x="144" y="68" width="24" height="8" rx="1"/>
