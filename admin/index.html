<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Redirect | PW Premium Hub</title>
  <meta http-equiv="refresh" content="0; url=../admin-login.html">
  <style>
    body {
      background: #070a14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      text-align: center;
    }
    .redirect-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(99, 102, 241, 0.4);
      border-radius: 16px;
      padding: 30px 24px;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .redirect-link {
      display: inline-block;
      margin-top: 14px;
      background: #4f46e5;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div style="font-size: 2rem; margin-bottom: 8px;">🛡️</div>
    <h2 style="margin: 0 0 6px 0; font-size: 1.2rem;">Opening Admin Portal...</h2>
    <p style="font-size: 0.82rem; color: #94a3b8; margin: 0 0 12px 0;">Please wait while you are redirected to the staff verification screen.</p>
    <a href="../admin-login.html" class="redirect-link" id="redirectLink">Click here if not redirected automatically →</a>
  </div>

  <script>
    (function() {
      const isAuth = sessionStorage.getItem("admin_authenticated") === "true";
      const target = isAuth ? "../admin.html" : "../admin-login.html";
      window.location.replace(target);
    })();
  </script>
</body>
</html>
