<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <!-- 
    ==========================================================================
    QR CODE 3: Paytm / Any Bank UPI QR
    ==========================================================================
    NOTE FOR REPLACEMENT:
    You can easily replace this entire file with your real Paytm QR code 
    (SVG or PNG renamed to qr3.svg), or export your QR code from Paytm / BHIM app.
    ==========================================================================
  -->
  <defs>
    <filter id="qr-shadow-3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="320" height="320" rx="16" fill="#FFFFFF"/>

  <!-- Quiet Zone / Inner Border -->
  <rect x="16" y="16" width="288" height="288" rx="8" fill="#FFFFFF" stroke="#F1F3F9" stroke-width="1.5"/>

  <!-- QR Matrix Group -->
  <g fill="#0F2042" filter="url(#qr-shadow-3)">
    <!-- Top-Left Position Detection Pattern -->
    <path d="M 32 32 H 88 V 88 H 32 Z M 40 40 V 80 H 80 V 40 Z"/>
    <rect x="48" y="48" width="24" height="24" rx="3" fill="#002970"/>

    <!-- Top-Right Position Detection Pattern -->
    <path d="M 232 32 H 288 V 88 H 232 Z M 240 40 V 80 H 280 V 40 Z"/>
    <rect x="248" y="48" width="24" height="24" rx="3" fill="#002970"/>

    <!-- Bottom-Left Position Detection Pattern -->
    <path d="M 32 232 H 88 V 288 H 32 Z M 40 240 V 280 H 80 V 240 Z"/>
    <rect x="48" y="248" width="24" height="24" rx="3" fill="#002970"/>

    <!-- Alignment Pattern (Bottom-Right) -->
    <path d="M 224 224 H 256 V 256 H 224 Z M 230 230 V 250 H 250 V 230 Z"/>
    <rect x="236" y="236" width="8" height="8" fill="#00BAF2"/>

    <!-- Timing Patterns -->
